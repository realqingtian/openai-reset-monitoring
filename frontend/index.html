<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 重置监控 · @thsottiaux</title>
<link rel="icon" id="favSvg" href="/assets/brand-light.svg?v=2" type="image/svg+xml">
<link rel="icon" id="favPng" href="/assets/brand-light-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" id="favTouch" href="/assets/brand-light-180.png?v=2">
<script>
/* 首屏前应用主题，避免闪烁 */
try {
  var _s = localStorage.getItem("crm-theme");
  var _m = ["light", "dark", "system"].includes(_s) ? _s : "light";
  var _t = _m === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : _m;
  document.documentElement.dataset.theme = _t;
  document.getElementById("favSvg").href = "/assets/brand-" + _t + ".svg?v=2";
  document.getElementById("favPng").href = "/assets/brand-" + _t + "-32.png?v=2";
  document.getElementById("favTouch").href = "/assets/brand-" + _t + "-180.png?v=2";
} catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
