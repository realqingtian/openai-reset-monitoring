[project]
name = "openai-reset-monitoring"
version = "0.1.0"
description = "监控 X 账号的 Codex 用量重置公告，命中时推送全部已配置的通知渠道"
readme = "README.md"
authors = [
    { name = "Sunny", email = "realqingtian@outlook.com" }
]
requires-python = ">=3.9"
license = "MIT"
# 与 requirements.txt 保持一致（requirements.txt 供 Docker 构建与 run.sh 的 pip 兜底路径使用）
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "starlette",
    "pydantic",
]

[dependency-groups]
# 类型检查，配置见下方 [tool.mypy]
dev = ["mypy>=1.19"]

[tool.mypy]
python_version = "3.9"
files = ["app"]
# 与 PyCharm 检查对齐的基础配置：缺失第三方 stub 不报，函数体即使缺标注也检查
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
