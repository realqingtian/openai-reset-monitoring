[project]
name = "openai-reset-monitoring"
version = "0.1.0"
description = "监控 X 账号的 Codex 用量重置公告，命中时推送全部已配置的通知渠道"
readme = "README.md"
authors = [
    { name = "Sunny", email = "realqingtian@outlook.com" }
]
requires-python = ">=3.9"
license = "MIT"
# 与 requirements.txt 保持一致（requirements.txt 供 Docker 构建与 run.sh 的 pip 兜底路径使用）
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "starlette",
    "pydantic",
]

[dependency-groups]
# 代码检查：ruff 负责静态检查与格式化（配置见下方 [tool.ruff]），mypy 负责类型检查（配置见下方 [tool.mypy]）
dev = ["mypy>=1.19", "ruff>=0.16"]

[tool.ruff]
# 静态检查 + 格式化，一键运行见 check.sh；目标版本由 requires-python 自动推导
line-length = 120
src = ["app"]

[tool.ruff.lint]
# 在 ruff 默认（E4/E7/E9 pycodestyle 错误 + F pyflakes）之上启用当前主流规则集：
# W 空白规范、I 导入排序、UP 语法现代化、B 常见 bug、C4 推导式、SIM 简化写法、RUF ruff 专属
select = ["E4", "E7", "E9", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# 中文注释与文档字符串里的全角标点（（）等）会被误判为“歧义字符”，豁免
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# 最新版 mypy 已不再支持 3.9 检查目标，此处为检查下限而非运行版本要求
python_version = "3.10"
files = ["app"]
# 与 PyCharm 检查对齐的基础配置：缺失第三方 stub 不报，函数体即使缺标注也检查
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
